name: Docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Install docs deps
        run: uv sync --group docs --no-default-groups

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages branch (if exists)
        run: git fetch origin gh-pages --depth=1 || true

      - name: Deploy dev (main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv run mike deploy --push --update-aliases dev

      - name: Deploy tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          uv run mike deploy --push --update-aliases "$VERSION" latest
          uv run mike set-default --push latest

      - name: Manual dispatch — deploy dev
        if: github.event_name == 'workflow_dispatch'
        run: uv run mike deploy --push --update-aliases dev
