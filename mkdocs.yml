site_name: musickit-api-mock
site_description: Apple Music API mock for MusicKit JS — runs as an in-process request interceptor inside browser-automation tests.
site_url: https://hotaritobu.github.io/musickit-api-mock/
repo_url: https://github.com/HotariTobu/musickit-api-mock
repo_name: HotariTobu/musickit-api-mock
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - packages/core/src
            - packages/playwright/src
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_section_style: table
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HotariTobu/musickit-api-mock

nav:
  - Home: index.md
  - Guide:
      - guide/index.md
      - Getting started: guide/getting-started.md
      - Surfaces overview: guide/surfaces.md
      - Playwright integration: guide/playwright.md
  - Reference:
      - reference/index.md
      - MusicKitApiMock: reference/mock.md
      - mock.data: reference/data.md
      - mock.endpoints: reference/endpoints.md
      - mock.browser: reference/browser.md
      - Playwright adapter: reference/playwright.md
  - Recipes:
      - recipes/index.md
      - Signed-in with subscription: recipes/signed-in-with-subscription.md
      - Subscription expired mid-playback: recipes/subscription-expired.md
      - DRM license failure: recipes/drm-license-failure.md
      - Multiple storefronts: recipes/multi-storefront.md
      - Callable resolvers: recipes/callable-resolvers.md
      - Bind to a browser context: recipes/bind-to-context.md
      - Swap authorize between tests: recipes/swap-authorize-between-tests.md
