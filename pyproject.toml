[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff.lint]
extend-select = [
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "D",
    "ERA",
    "FA",
    "FBT",
    "G",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "TC",
    "TID",
    "UP",
    "W",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**/*.py" = ["S101", "S105", "S106", "D"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "ty>=0.0.32",
]
docs = [
    "mike>=2.2.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
]
